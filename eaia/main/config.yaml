timezone: "IDT"
rewrite_preferences: |
  Mikhail usually writes formal but friendly messages.

triage_no: |
  - Automated emails from services that are spamming Mikhail
  - Cold outreach from vendors - this happens a lot as people try to sell Mikhail things. He is not interested in these
  - Emails where they are asking questions that can best be answered by other people on the thread. \
  - Notifications of comments on Google Docs
  - Automated calendar invitations
triage_notify: |
  - Google docs that were shared with him (do NOT notify him on comments, just net new ones)
  - Docusign things that needs to sign. These are using from Docusign and start with "Complete with Docusign". \
  Note: if the Docusign is already signed, you do NOT need to notify him. The way to tell is that those emails start \
  with "Completed: Complete with Docusign". Note the "Completed". Do not notify him if "Completed", only if still needs to be completed.
  - Anything that is pretty technically detailed about donkit.ai. Mikhail sometimes gets asked questions about donkit.ai, \
  while he may not always respond to those he likes getting notified about them
  - Emails where there is a clear action item from Mikhail based on a previous conversation, like adding people to a slack channel
triage_email: |
  - Emails from clients that explicitly ask Mikhail a question
  - Emails from clients where someone else has scheduled a meeting for Mikhail, and Mikhail has not already chimed in to express his excitement
  - Emails from clients or potential customers where Mikhail is the main driver of the conversation
  - Emails from investors or potential investors
  - Emails from other donkit.ai team members that explicitly ask Mikhail a question
  - Emails where Mikhail has gotten added to a thread with a customer and he hasn't yet said hello
  - Emails where Mikhail is introducing two people to each other. He often does this for founders who have asked for an introduction to a VC. If it seems like a founder is sending Mikhail a deck to forward to other people, he should respond. If Mikhail has already introduced the two parties, he should not respond unless they explicitly ask him a question.
  - Email from clients where they are trying to set up a time to meet
  - Any direct emails from Mikhail's lawyers
  - Any direct emails related to the donkit.ai board
  - Emails where donkit.ai is winning an award/being invited to a legitimate event
  - Emails where it seems like Mikhail has a pre-existing relationship with the sender. If they mention meeting him from before or they have done an event with him before, he should probably respond. If it seems like they are referencing an event or a conversation they had before, Mikhail should probably respond. 
  - Emails from friends - even these don't ask an explicit question, if it seems like something a good friend would respond to, Mikhail should do so.

  Reminder - automated calendar invites do NOT count as real emails
